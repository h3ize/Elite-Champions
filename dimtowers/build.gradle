plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.21'
}
version = '1.0.0'
group = 'com.example.dimtowers'
base { archivesName = 'dimtowers' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server(); programArguments.add('--nogui') }
    }
    mods { dimtowers { sourceSet sourceSets.main } }
}
