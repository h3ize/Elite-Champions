mod_description=Mob Ascension turns ordinary hostile mobs into powerful champions. Each one spawns as a Veteran, Elite, Mythic or Apex with its own stats, glowing rank colours, special abilities such as Vampiric, Thorned, Frostbite and Stormcaller, and ranged attacks.\n\nDefeating a champion rewards you with gear, loot and a little extra experience, scaling with its rank. Almost everything can be tuned in the config.
