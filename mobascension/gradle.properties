mod_description=Mob Ascension turns ordinary hostile mobs into powerful champions. Every spawn has a chance to ascend into a Veteran, Elite, Mythic or Apex, each with randomly rolled stat levels, rank-coloured glow and particles, extra health, armor, speed and damage, and random abilities such as Vampiric, Thorned, Frostbite, Blinker and Stormcaller.\n\nOnly Apex champions use ranged attacks, hurling wither skulls and large fireballs, and they automatically hunt players within 30 blocks. If passive mobs are enabled, Apex passive mobs attack too.\n\nDefeating a champion drops gear, loot and experience that scale with its rank. Almost everything can be tuned in the config.
